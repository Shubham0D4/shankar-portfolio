<!doctype html>
<html lang="en">
<head>
<!--shell:head-->
</head>
<body data-page="home">
<!--shell:header-->
<main id="main">
  <section class="hero" data-tone="dark" aria-labelledby="hero-name">
    <figure class="hero__stage" aria-labelledby="hero-caption">
      <!--shell:hero-still-->
    </figure>
    <div class="frame hero__inner grid">
      <div class="hero__copy">
        <p class="hero__role">Architecture student, Sir J.J. College of Architecture, Mumbai</p>
        <h1 class="hero__name" id="hero-name">Shankar <span class="kern-w">W</span>agh</h1>
        <p class="hero__lead"><!--shell:statement-lead--></p>
        <ul class="hero__links" role="list">
          <li><a class="button button--solid" href="/work/">See the work</a></li>
          <li><a class="button" href="/about/">About Shankar</a></li>
        </ul>
      </div>
      <div class="hero__foot">
        <!--shell:scale-bar-->
        <p class="hero__caption" id="hero-caption">Drafting compass, scale rule, set square, pencil and a rolled drawing, modelled in code.</p>
      </div>
    </div>
    <!--shell:hero-arc-->
  </section>

  <section class="section frame" aria-labelledby="featured-title">
    <div class="section__head" data-reveal>
      <h2 id="featured-title">Selected work</h2>
      <a href="/work/">All eight projects</a>
    </div>
    <!--shell:cards-featured-->
  </section>

  <section class="section frame" aria-labelledby="statement-title">
    <h2 class="visually-hidden" id="statement-title">Statement</h2>
    <figure class="statement grid" data-reveal>
      <blockquote><p><!--shell:statement--></p></blockquote>
      <figcaption class="statement__by">
        <span class="statement__name">Shankar Wagh</span>
        <span class="statement__role">B.Arch, fourth year</span>
      </figcaption>
    </figure>
  </section>
</main>
<!--shell:footer-->
</body>
</html>
